[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightgfc"
version = "0.1.0"
description = "Graph-free condensation and node-classification experiments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.scripts]
lightgfc = "lightgfc.cli:main"

[tool.setuptools.packages.find]
include = ["lightgfc"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
